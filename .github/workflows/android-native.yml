# Native Android Hivogram: Cherrygram (GPLv2 fork of Telegram for Android) + alltginone/android/patches.
# Not Tauri: the whole app is Cherrygram's Java/C++ client (Telegram base). Built from the private repo with SOURCE_TOKEN,
# signed with the same permanent key as the other APKs (ANDROID_KEYSTORE_* secrets), Telegram keys built in.
name: Hivogram Android (native)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of alltginone to build
        default: main
      publish:
        description: Publish a release (false = test build, artifact only)
        type: boolean
        default: false
  # TEMPORARY (until this workflow is on main): test builds of the work branch on push. Remove before merging.
  push:
    branches: [claude/project-thread-1ryc93]
    paths: [.github/workflows/android-native.yml, .android-build-trigger]

permissions:
  contents: read

concurrency:
  group: android-native-${{ inputs.ref || 'push' }}
  cancel-in-progress: false

env:
  SOURCE_REPO: chvdbhcx-del/alltginone
  ANDROID_NDK_VERSION: '27.2.12479018'
  # every build installs over the previous one: versionCode = Telegram's code x 10000 + this number
  HIVOGRAM_BUILD: ${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: src
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref || 'claude/project-thread-1ryc93' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Keys present?
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: '[ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            src/android/upstream.env
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - name: SDK, NDK, CMake
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1" > /dev/null
      - name: Cherrygram + Hivogram patches
        run: android/fetch-upstream.sh
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64: APK signed with a throwaway key, it will not install over an older APK"
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug" > /dev/null
            exit 0
          fi
          cd android/src/TMessagesProj_App
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-androiddebugkey}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties
      - name: Gradle assemble (Java/Kotlin + native tgnet/tgcalls)
        working-directory: src/android/src
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" :TMessagesProj_App:assembleAfatRelease
      - name: Collect
        run: |
          VERSION=$(grep -E '^APP_VERSION_NAME_HIVOGRAM=' android/src/gradle.properties | cut -d= -f2)
          APK=$(find android/src/TMessagesProj_App/build/outputs/apk -name '*universal*.apk' -o -name 'Hivogram-*.apk' | head -n1)
          [ -n "$APK" ] || { find android/src/TMessagesProj_App/build/outputs -name '*.apk'; echo "::error::No APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtmessages"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E 'certificate (DN|SHA-256)' | tee -a "$GITHUB_STEP_SUMMARY" || true
          mkdir -p ../out
          cp "$APK" "../out/Hivogram-${VERSION}-android-native.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native
          path: out/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error


  # Demo screenshots on an emulator (self-check for every build): invented accounts, offline.
  screens:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-native
          path: apk
      - name: Russian language file
        run: curl -fsSL "https://translations.telegram.org/ru/android/export" -o ru.xml || echo "::warning::No ru.xml, screens will be in English"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator and screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          OUT: shots
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: APK=$(ls apk/*.apk | head -n1) bash .github/android-screens/shoot.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-native-screens
          path: shots/*
          retention-days: 7
  release:
    needs: apk
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builds
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          cd out && sha256sum * > SHA256SUMS.txt && ls -l
          VERSION=$(ls Hivogram-*.apk | head -n1 | sed -E 's/^Hivogram-([0-9.]+)-.*/\1/')
          TAG="android-v${VERSION}-build.${{ github.run_number }}"
          ../builds/.github/scripts/sign-sums.sh SHA256SUMS.txt "$TAG"
          gh release create "$TAG" * \
            --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Hivogram для Android (нативный) ${VERSION}, сборка ${{ github.run_number }}" \
            --notes "Нативный Hivogram для Android на базе Cherrygram (форк Telegram для Android), не Tauri. Ключи Telegram вшиты. Ветка \`${REF}\`.

          - \`Hivogram-${VERSION}-android-native.apk\` — Android 7+. Ставится рядом с прежним Hivogram (другой идентификатор приложения)."
