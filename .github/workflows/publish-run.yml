# Puts the files of an earlier Hivogram run (its workflow artifacts, kept 3 days) into a release,
# e.g. when that run built fine but its release step failed.
name: Publish a run
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the Hivogram run (from its URL)
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove probe releases
        run: |
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("probe-"))'); do gh release delete "$t" --yes --cleanup-tag || true; done
          for r in $(gh api "repos/$GH_REPO/git/matching-refs/tags/probe-" --jq '.[].ref'); do gh api -X DELETE "repos/$GH_REPO/git/$r" || true; done
          for id in $(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft and .name == "") | .id'); do gh api -X DELETE "repos/$GH_REPO/releases/$id" || true; done
      # Only the signer script of this repo: it signs SHA256SUMS.txt for the in-app updaters
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builds
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Download and release
        env:
          RUN_ID: ${{ inputs.run_id }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be the number from the run's URL"; exit 1; }
          WORKFLOW=$(gh run view "$RUN_ID" --json workflowName --jq .workflowName)
          [ "$WORKFLOW" = Hivogram ] || { echo "::error::Run $RUN_ID is a '$WORKFLOW' run, not a Hivogram one"; exit 1; }
          # The files carry that run's number (HIVOGRAM_BUILD = its run_number): the tag must name the same build so the
          # in-app updaters (TAG_RE in host/src/updates.ts) match it and do not offer it again to the build itself.
          BUILD=$(gh run view "$RUN_ID" --json number --jq .number)
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::No run number for run $RUN_ID"; exit 1; }
          gh run download "$RUN_ID" --dir out
          cd out && find . -type f -exec mv {} . \; && find . -mindepth 1 -type d -delete
          sha256sum * > SHA256SUMS.txt && ls -l
          VERSION=$(ls Hivogram-*.* | head -n1 | sed -E 's/^Hivogram-([0-9.]+)-.*/\1/')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad version '$VERSION'"; exit 1; }
          TAG="hivogram-v${VERSION}-build.${BUILD}"
          ../builds/.github/scripts/sign-sums.sh SHA256SUMS.txt "$TAG"
          gh release create "$TAG" * --latest=false \
            --title "Hivogram ${VERSION}, сборка ${BUILD}" \
            --notes "Ключи Telegram вшиты, вводить ничего не надо.

          - \`Hivogram-${VERSION}-windows-x64-setup.exe\` — Windows 10/11. Если SmartScreen ругается: «Подробнее» → «Выполнить в любом случае».
          - \`Hivogram-${VERSION}-android.apk\` — Android 7+.
          - iPhone и браузер: https://hivogram.pages.dev (в Safari → «Поделиться» → «На экран Домой»)."
