# TEMPORARY: UX review of native Android Hivogram. Emulator taps every button of every screen (demo accounts,
# offline) and uploads screenshots + UI dumps. Runs on push of this branch only; remove before merging.
name: UX explore (Android native)

on:
  push:
    branches: [claude/project-thread-a5vxdf]
    paths: [.github/ux-explore/**, .github/workflows/ux-explore-android.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: ux-explore-android
  cancel-in-progress: true

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: a, screens: 'chats,inbox,inbox_sort,crm,group,account,inbox_all' }
          - { name: b, screens: 'settings,prefs,tabs,accounts,lock,calls,search' }
          - { name: c, screens: 'broadcasts,broadcast_edit,broadcast_history,templates,chat_templates,groups' }
          - { name: d, screens: 'chat,ghost,history,quiet,ai,business' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC=$(cat .github/ux-explore/apk.txt)
          mkdir -p apk
          case "$SRC" in
            url:*) curl -fsSL "${SRC#url:}" -o apk/app.apk ;;
            run:*) gh run download "${SRC#run:}" -R "$GITHUB_REPOSITORY" -n android-native -D apk ;;
          esac
          ls -l apk
          pip install -q pillow || true
      - name: Russian language file
        run: curl -fsSL "https://translations.telegram.org/ru/android/export" -o ru.xml || echo "::warning::No ru.xml"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator and exploration
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          OUT: ux
          SCREENS: ${{ matrix.part.screens }}
          BUDGET_MIN: '190'
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: APK=$(ls apk/*.apk | head -n1) bash .github/ux-explore/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ux-android-${{ matrix.part.name }}
          path: ux/*
          retention-days: 7
