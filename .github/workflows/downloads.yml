# ONE release «Hivogram — все версии» (tag v<date>, Latest) with the newest file of every version
# (WEBA, APK, UNI, Rust + сайт link), and the «Скачать» table in README.md pointing at it.
# Runs after every build workflow, on any release published from outside (Unigram from the PC), hourly as a
# fallback, or by hand (force = rebuild the shared release even if nothing changed).
name: Shared release
on:
  workflow_run:
    workflows: [Hivogram, Hivogram Lite, Publish a run]
    types: [completed]
  release:
    types: [published]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the shared release even if it is up to date
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: shared-release
  cancel-in-progress: false
jobs:
  update:
    # Our own new shared release publishes a release too: don't react to it.
    if: github.event_name != 'release' || !(startsWith(github.event.release.tag_name, 'hivogram-all-') || startsWith(github.event.release.tag_name, 'all-v') || startsWith(github.event.release.tag_name, 'v20'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      # Builds before the fix in hivogram.yml put the intermediate dist.tgz into their release: remove it
      - name: Drop stray dist.tgz
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[].assets[] | select(.name == "dist.tgz") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/assets/$id" && echo "deleted asset $id"; done
      - name: Shared release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          FORCE: ${{ inputs.force || false }}
        run: .github/scripts/release-all.sh
      - name: Rebuild the README table
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 .github/scripts/update-downloads.py "$RUNNER_TEMP/releases.json" README.md
      - name: Commit if changed
        run: |
          git diff --quiet README.md && { echo "Table is up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "README: свежие ссылки на скачивание" README.md
          git push
