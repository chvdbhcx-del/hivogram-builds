# Which public copies of the Telegram for macOS source exist, and how fresh they are (no secrets, read-only).
name: macOS probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          export GIT_TERMINAL_PROMPT=0
          for r in overtake/TelegramSwift macosswift/telegram Novagramorg/macOS TelegramOrg/Telegram-macos-Swift vincentkoc/TelegramSwift olomix/TelegramSwift zweeltow/TelegramSwift vanarok/TelegramSwift nhphuc699/TelegramSwift okulkarni/TelegramSwift; do
            d=$(echo "$r" | tr / _)
            if git clone -q --depth 1 --filter=blob:none --no-checkout "https://github.com/$r" "$d" 2>/dev/null; then
              echo "== $r: $(git -C "$d" log -1 --format='%cd | %s' --date=short) | $(git -C "$d" rev-parse --abbrev-ref HEAD)"
            else
              echo "== $r: MISSING"
            fi
          done
          curl -s https://api.github.com/repos/overtake/TelegramSwift | head -5
