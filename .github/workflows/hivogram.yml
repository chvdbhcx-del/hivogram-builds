# Hivogram (Tauri shell + Telegram Web A fork) from the private repo chvdbhcx-del/alltginone:
# Windows installer + Android APK into a release of THIS repo, and the web app (iPhone) to hivogram.pages.dev.
# This repo is public only so that Actions minutes are free; the source stays private and is checked out with
# the SOURCE_TOKEN secret. Nothing secret is printed: GitHub masks secrets in the logs.
name: Hivogram

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of alltginone to build
        default: main
      targets:
        description: What to build (windows, android, pages)
        default: windows,android,pages
      publish:
        description: Publish a release (false = test build, artifacts only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hivogram-${{ inputs.targets }}
  cancel-in-progress: false

env:
  SOURCE_REPO: chvdbhcx-del/alltginone
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NODE_VERSION: '24'
  ANDROID_NDK_VERSION: '27.2.12479018'
  # Web A's tsc/eslint/vite need more heap (client/.npmrc overrides NODE_OPTIONS)
  npm_config_node_options: --no-experimental-strip-types --max-old-space-size=8192
  # TELEGRAM_API_ID / TELEGRAM_API_HASH are given only to the steps that check them or build them in
  # Cloud updates: every build knows its number and compares it with the `-build.<n>` of the releases here
  HIVOGRAM_BUILD: ${{ github.run_number }}

jobs:
  # fmt, clippy, tests and the host build of the source first: nothing below runs (or publishes) when they fail
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.ref }}
      lite: false
    secrets:
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}

  # Web A + host → dist/ ONCE for the exe and the APK (they embed the same files); the web app (pages) builds its own
  # variant with HIVOGRAM_WEB=1 (browser push), so it is not shared.
  web:
    needs: check
    if: contains(inputs.targets, 'windows') || contains(inputs.targets, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Keys present?
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: '[ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/host/package-lock.json
      - name: Versions match?
        env:
          REF: ${{ inputs.ref }}
        run: |
          # every file that carries the version must carry the same one (refs before the check have no script)
          if [ -f scripts/check-versions.mjs ]; then node scripts/check-versions.mjs; else echo "::warning::No scripts/check-versions.mjs on $REF"; fi
      - run: npm ci --no-audit --no-fund
      - run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - run: npm run fetch:weba
      - name: npm run build:web (Web A + host → dist/, keys built in)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: npm run build:web
      # ~11 000 small files: one tarball uploads and downloads much faster than an artifact of loose files
      - name: Pack dist/
        run: tar -C dist -czf ../dist.tgz . && ls -l ../dist.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: dist.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  windows:
    needs: [check, web]
    if: contains(inputs.targets, 'windows')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - name: Long paths (Web A's node_modules)
        working-directory: .
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Keys present?
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: '[ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/host/package-lock.json
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: windows
      - name: Versions match?
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          # every file that carries the version must carry the same one (refs before the check have no script)
          if [ -f scripts/check-versions.mjs ]; then node scripts/check-versions.mjs; else echo "::warning::No scripts/check-versions.mjs on $REF"; fi
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: src
      - name: dist/ from the web job
        shell: bash
        run: mkdir -p dist && tar -C dist -xzf dist.tgz && rm dist.tgz && ls dist | head
      - name: tauri build (dist/ is ready, so no beforeBuildCommand)
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: npx tauri build --ci --bundles nsis --config '{"build":{"beforeBuildCommand":null}}'
      - name: Collect
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p ../out
          cp "$(ls target/release/bundle/nsis/*.exe | head -n1)" "../out/Hivogram-${VERSION}-windows-x64-setup.exe"
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/*
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  android:
    needs: [check, web]
    if: contains(inputs.targets, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Keys present?
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: '[ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }'
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          # Gradle's caches and wrapper (~/.gradle), keyed on the Android project's build files
          cache: gradle
          cache-dependency-path: |
            src/src-tauri/gen/android/*.gradle*
            src/src-tauri/gen/android/**/*.gradle*
            src/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/host/package-lock.json
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: android
      - name: Versions match?
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          # every file that carries the version must carry the same one (refs before the check have no script)
          if [ -f scripts/check-versions.mjs ]; then node scripts/check-versions.mjs; else echo "::warning::No scripts/check-versions.mjs on $REF"; fi
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: src
      - name: dist/ from the web job
        run: mkdir -p dist && tar -C dist -xzf dist.tgz && rm dist.tgz && ls dist | head
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # a throwaway key is fine for a test build, never for a release: it would not install over an older APK
            if [ "$PUBLISH" = true ]; then
              echo "::error::No ANDROID_KEYSTORE_BASE64: a release APK must be signed with the permanent key (run with publish = false for a test build)"
              exit 1
            fi
            echo "::warning::No ANDROID_KEYSTORE_BASE64: test APK signed with a throwaway key, it will not install over an older APK"
            exit 0
          fi
          cd src-tauri/gen/android
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          # defaults = the Android debug keystore (~/.android/debug.keystore from the PC)
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-androiddebugkey}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties
      - name: tauri android build (dist/ is ready, so no beforeBuildCommand)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: npx tauri android build --ci --apk --target aarch64 armv7 --config '{"build":{"beforeBuildCommand":null}}'
      - name: Collect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          # the shell's native library (lib<crate>_lib.so) for both ABIs
          unzip -l "$APK" | grep -qE 'lib/arm64-v8a/lib[a-z0-9_]+_lib\.so'
          unzip -l "$APK" | grep -qE 'lib/armeabi-v7a/lib[a-z0-9_]+_lib\.so'
          # Signing certificate (public): must stay the same across releases, or updates won't install
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          if [ -x "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs "$APK" | grep -E 'certificate (DN|SHA-256)' | tee -a "$GITHUB_STEP_SUMMARY" || true; else echo "::warning::apksigner not found, signer not printed"; fi
          mkdir -p ../out
          cp "$APK" "../out/Hivogram-${VERSION}-android.apk"
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/*
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [check, windows, android]
    if: always() && !cancelled() && inputs.publish && needs.check.result == 'success' && (needs.windows.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      # Only the signer script of this repo (not the source): it signs SHA256SUMS.txt for the in-app updaters
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builds
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # web-dist (the shared Web A build for windows/android) is downloaded too: it is not a release file
          cd out && rm -f dist.tgz && sha256sum * > SHA256SUMS.txt && ls -l
          VERSION=$(ls Hivogram-*.* | head -n1 | sed -E 's/^Hivogram-([0-9.]+)-.*/\1/')
          TAG="hivogram-v${VERSION}-build.${{ github.run_number }}"
          ../builds/.github/scripts/sign-sums.sh SHA256SUMS.txt "$TAG"
          gh release create "$TAG" * \
            --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Hivogram ${VERSION}, сборка ${{ github.run_number }}" \
            --notes "Ключи Telegram вшиты, вводить ничего не надо. Ветка \`${REF}\`.

          - \`Hivogram-${VERSION}-windows-x64-setup.exe\` — Windows 10/11. Если SmartScreen ругается: «Подробнее» → «Выполнить в любом случае».
          - \`Hivogram-${VERSION}-android.apk\` — Android 7+.
          - iPhone и браузер: https://hivogram.pages.dev (в Safari → «Поделиться» → «На экран Домой»)."

  pages:
    needs: check
    if: contains(inputs.targets, 'pages')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    env:
      HIVOGRAM_PAGES_PROJECT: hivogram
      # a test build (publish = false) goes to the preview https://preview.hivogram.pages.dev, never to the live site
      HIVOGRAM_PAGES_BRANCH: ${{ inputs.publish && 'main' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Secrets present?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          REF: ${{ inputs.ref }}
        run: |
          [ -f scripts/build-pages.mjs ] || { echo "::error::No web app build (scripts/build-pages.mjs) on $REF"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/host/package-lock.json
      - name: Versions match?
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          # every file that carries the version must carry the same one (refs before the check have no script)
          if [ -f scripts/check-versions.mjs ]; then node scripts/check-versions.mjs; else echo "::warning::No scripts/check-versions.mjs on $REF"; fi
      - run: npm ci --no-audit --no-fund
      - run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - run: npm run fetch:weba
      - name: Build + deploy (wrangler pages deploy)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          VAPID_KEY: ${{ secrets.VAPID_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'eacbea7296b962fa85553489df97d99d' }}   # account id is not a secret
        run: |
          [ -n "$VAPID_KEY" ] || unset VAPID_KEY   # empty = read Telegram's key from web.telegram.org/a
          npm run deploy:pages
      # The first upload from the PC stopped at 1000 of ~11 400 files: check the whole build is online.
      - name: Check the files are online
        run: |
          cd dist-web
          find . -type f ! -name _headers ! -name _redirects | sed 's|^\./||' | sort > "$RUNNER_TEMP/files.txt"
          echo "files in build: $(wc -l < "$RUNNER_TEMP/files.txt")"
          if [ "$HIVOGRAM_PAGES_BRANCH" = main ]; then BASE="https://${HIVOGRAM_PAGES_PROJECT}.pages.dev"; else BASE="https://${HIVOGRAM_PAGES_BRANCH}.${HIVOGRAM_PAGES_PROJECT}.pages.dev"; fi
          for attempt in 1 2 3 4 5 6; do
            missing=0; checked=0
            while read -r f; do
              checked=$((checked+1))
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$BASE/$f")
              if [ "$code" != 200 ]; then missing=$((missing+1)); echo "  $code $f"; fi
            done < <(awk 'NR % 25 == 0' "$RUNNER_TEMP/files.txt"; tail -n 20 "$RUNNER_TEMP/files.txt")
            echo "attempt $attempt: $missing of $checked missing at $BASE"
            [ "$missing" = 0 ] && exit 0
            sleep 20
          done
          echo "::error::$missing of $checked sampled files are not on $BASE (is the Pages project's production branch 'main'?)"
          exit 1
