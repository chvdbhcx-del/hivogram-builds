# Hivogram (Tauri shell + Telegram Web A fork) from the private repo chvdbhcx-del/alltginone:
# Windows installer + Android APK into a release of THIS repo, and the web app (iPhone) to hivogram.pages.dev.
# This repo is public only so that Actions minutes are free; the source stays private and is checked out with
# the SOURCE_TOKEN secret. Nothing secret is printed: GitHub masks secrets in the logs.
name: Hivogram

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of alltginone to build
        default: claude/project-thread-3mki98
      targets:
        description: What to build (windows, android, pages)
        default: windows,android,pages

permissions:
  contents: read

concurrency:
  group: hivogram-${{ inputs.targets }}
  cancel-in-progress: false

env:
  SOURCE_REPO: chvdbhcx-del/alltginone
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NODE_VERSION: '24'
  ANDROID_NDK_VERSION: '27.2.12479018'
  # Web A's tsc/eslint/vite need more heap (client/.npmrc overrides NODE_OPTIONS)
  npm_config_node_options: --no-experimental-strip-types --max-old-space-size=8192
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

jobs:
  windows:
    if: contains(inputs.targets, 'windows')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - name: Long paths (Web A's node_modules)
        working-directory: .
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Keys present?
        shell: bash
        run: '[ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/host/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: windows
      - run: npm ci --no-audit --no-fund
      - run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - run: npm run fetch:weba
      - name: tauri build (beforeBuildCommand = npm run build:web)
        run: npx tauri build --ci --bundles nsis
      - name: Collect
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p ../out
          cp "$(ls target/release/bundle/nsis/*.exe | head -n1)" "../out/Hivogram-${VERSION}-windows-x64-setup.exe"
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  android:
    if: contains(inputs.targets, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Keys present?
        run: '[ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }'
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/host/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: android
      - run: npm ci --no-audit --no-fund
      - run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - run: npm run fetch:weba
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64: APK signed with a throwaway key, it will not install over an older APK"
            exit 0
          fi
          cd src-tauri/gen/android
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          # defaults = the Android debug keystore (~/.android/debug.keystore from the PC)
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-androiddebugkey}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties
      - name: tauri android build (beforeBuildCommand = npm run build:web)
        run: npx tauri android build --ci --apk --target aarch64 armv7
      - name: Collect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/liborbit_lib.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/liborbit_lib.so'
          mkdir -p ../out
          cp "$APK" "../out/Hivogram-${VERSION}-android.apk"
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [windows, android]
    if: always() && !cancelled() && (needs.windows.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          cd out && sha256sum * > SHA256SUMS.txt && ls -l
          VERSION=$(ls Hivogram-*.* | head -n1 | sed -E 's/^Hivogram-([0-9.]+)-.*/\1/')
          gh release create "hivogram-v${VERSION}-build.${{ github.run_number }}" * \
            --repo "$GITHUB_REPOSITORY" --latest \
            --title "Hivogram ${VERSION}, сборка ${{ github.run_number }}" \
            --notes "Ключи Telegram вшиты, вводить ничего не надо. Ветка \`${REF}\`.

          - \`Hivogram-${VERSION}-windows-x64-setup.exe\` — Windows 10/11. Если SmartScreen ругается: «Подробнее» → «Выполнить в любом случае».
          - \`Hivogram-${VERSION}-android.apk\` — Android 7+.
          - iPhone и браузер: https://hivogram.pages.dev (в Safari → «Поделиться» → «На экран Домой»)."

  pages:
    if: contains(inputs.targets, 'pages')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    env:
      HIVOGRAM_PAGES_PROJECT: hivogram
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Secrets present?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -f scripts/build-pages.mjs ] || { echo "::error::No web app build (scripts/build-pages.mjs) on ${{ inputs.ref }}"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/host/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - run: npm run fetch:weba
      - name: Build + deploy (wrangler pages deploy)
        env:
          VAPID_KEY: ${{ secrets.VAPID_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'eacbea7296b962fa85553489df97d99d' }}   # account id is not a secret
        run: |
          [ -n "$VAPID_KEY" ] || unset VAPID_KEY   # empty = read Telegram's key from web.telegram.org/a
          npm run deploy:pages
      # The first upload from the PC stopped at 1000 of ~11 400 files: check the whole build is online.
      - name: Check the files are online
        run: |
          cd dist-web
          find . -type f ! -name _headers ! -name _redirects | sed 's|^\./||' | sort > "$RUNNER_TEMP/files.txt"
          echo "files in build: $(wc -l < "$RUNNER_TEMP/files.txt")"
          BASE="https://${HIVOGRAM_PAGES_PROJECT}.pages.dev"
          for attempt in 1 2 3 4 5 6; do
            missing=0; checked=0
            while read -r f; do
              checked=$((checked+1))
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$BASE/$f")
              if [ "$code" != 200 ]; then missing=$((missing+1)); echo "  $code $f"; fi
            done < <(awk 'NR % 25 == 0' "$RUNNER_TEMP/files.txt"; tail -n 20 "$RUNNER_TEMP/files.txt")
            echo "attempt $attempt: $missing of $checked missing at $BASE"
            [ "$missing" = 0 ] && exit 0
            sleep 20
          done
          echo "::error::$missing of $checked sampled files are not on $BASE (is the Pages project's production branch 'main'?)"
          exit 1
