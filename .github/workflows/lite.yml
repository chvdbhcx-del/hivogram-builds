# Hivogram Lite (Rust + Slint) from lite/ of the private repo chvdbhcx-del/alltginone: Windows x64 installer
# with Hivogram's API keys baked in (lite/core/build.rs reads TELEGRAM_API_ID / TELEGRAM_API_HASH), into a release here.
name: Hivogram Lite

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of alltginone to build
        default: main

permissions:
  contents: read

concurrency:
  group: lite
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Cloud updates: the app compares its number with the `-build.<n>` of the lite-v… releases here
  HIVOGRAM_BUILD: ${{ github.run_number }}

jobs:
  # Lite's core tests and clippy first: nothing is built or published when they fail
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.ref }}
      shell: false
    secrets:
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/lite
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chvdbhcx-del/alltginone
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Keys present?
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          REF: ${{ inputs.ref }}
        run: |
          [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are not set"; exit 1; }
          [ -f core/build.rs ] || { echo "::error::$REF has no core/build.rs: keys would not be built in"; exit 1; }
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src/lite
          key: lite-windows
      # A prebuilt binary (cargo-binstall) instead of compiling cargo-packager on every run
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-packager@0.11.8
      - name: cargo build (core/build.rs bakes the keys in)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: cargo build --release --locked -p hivogram-lite --target x86_64-pc-windows-msvc
      - working-directory: src/lite/native
        run: cargo packager --release --target x86_64-pc-windows-msvc --formats nsis
      - name: Collect
        run: |
          VERSION=$(grep -m1 '^version' native/Cargo.toml | cut -d'"' -f2)
          [ -n "$VERSION" ] || { echo "::error::No version in native/Cargo.toml"; exit 1; }
          echo "$VERSION" > ../../version.txt
          mkdir -p ../../out
          for f in target/packager/*.exe; do cp "$f" "../../out/hivogram-lite-windows-x64-$(basename "$f")"; done
          ls -l ../../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-windows
          path: |
            out/*
            version.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  # Only this job can write to the repo, and it runs none of the source's code
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lite-windows
          path: dl
      # Only the signer script of this repo (not the source): it signs SHA256SUMS-lite.txt for the in-app updater
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builds
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          BUILD: ${{ github.run_number }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          VERSION=$(cat dl/version.txt)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad version '$VERSION'"; exit 1; }
          TAG="lite-v${VERSION}-build.${BUILD}"
          cd dl/out && sha256sum * > SHA256SUMS-lite.txt && ls -l
          ../../builds/.github/scripts/sign-sums.sh SHA256SUMS-lite.txt "$TAG"
          # A test build of another branch is a pre-release: the in-app updater skips those
          PRE=""
          [ "$REF" = main ] || PRE="--prerelease"
          gh release create "$TAG" * $PRE \
            --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Hivogram Lite ${VERSION}, сборка ${BUILD}" \
            --notes "Windows 10/11 x64, ключи Telegram вшиты. Ветка \`${REF}\`. Если SmartScreen ругается: «Подробнее» → «Выполнить в любом случае»."
